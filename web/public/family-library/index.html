<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob:; style-src 'self'; connect-src 'self'; img-src 'self' blob:; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>家人资料柜</title><link rel="stylesheet" href="./style.css"><script src="./vault.js" defer></script><script src="./app.js" defer></script></head>
<body>
<main id="login"><div class="login-card"><span class="eyebrow">给家人用的资料柜</span><div class="symbol" aria-hidden="true">＋</div><h1>家庭病历资料库</h1><p class="muted">输入家人给你的口令，<br>就能查资料、看报告。</p><form id="loginForm"><label for="passphrase">家庭口令</label><div class="password-row"><input id="passphrase" type="password" autocomplete="current-password" maxlength="128" placeholder="粘贴家人发来的口令" required><button id="showPassword" type="button" class="quiet">显示</button></div><p class="small muted">关闭页面或闲置15分钟后自动锁定。</p><button class="primary wide" id="loginButton" type="submit">进入资料库</button><p id="loginError" role="alert"></p></form><p class="small muted">请只在家人之间分享链接与口令。<br>口令忘了或打不开，请联系发给你的人。</p></div></main>
<main id="library" hidden><header><div><span class="eyebrow">家庭专用 · 随时查阅</span><h1>外公的病历资料</h1></div><button id="logout" class="quiet">锁定</button></header><p class="muted intro">记不清名字也没关系，说个大概就能找。</p><div class="stamp" id="stamp"></div>
<section class="searchbox"><form id="searchForm"><label for="query">想找什么材料？</label><div class="search-row"><input id="query" maxlength="200" type="search" placeholder="例如：某次检查或用药记录" autocomplete="off"><button class="primary" type="submit">找资料</button></div></form><div id="examples" class="chips"></div><details><summary>按类型或日期筛选</summary><div class="filters"><label>类型<select id="category"><option value="">全部类型</option></select></label><label>排序<select id="sort"><option value="">自动判断</option><option value="latest">最新在前</option><option value="earliest">最早在前</option><option value="relevance">最相关</option></select></label><label class="check"><input type="checkbox" id="duplicates">显示重复扫描</label></div></details></section>
<nav id="resources" class="resources" aria-label="整理好的资料"></nav><button id="browse" class="quiet browse">浏览全部材料 →</button><div id="alerts" aria-live="polite"></div><p class="small muted" id="understood"></p><div class="result-head"><h2 id="resultTitle">常用材料</h2><span id="count" class="small muted"></span></div><div id="status" role="status"></div><section id="cards" class="cards" aria-label="搜索结果"></section><button id="more" class="secondary wide" hidden>再看12份</button><footer><p>资料以整理日已收录的原件为准。历史药单不代表现在仍在用药，识别文字需对照原件。</p><p>有新资料或发现不清楚的地方，请告诉负责整理的家人。</p></footer></main>
<dialog id="viewer"><div class="viewer-head"><strong id="viewerTitle"></strong><button id="closeViewer" class="quiet">关闭</button></div><div class="viewer-links"><a id="original" target="_blank" rel="noopener">打开原件</a><a id="download">下载原件</a></div><p class="small muted viewer-tip" id="viewerTip">点击图片可放大。若微信无法打开 PDF，请用右上角菜单选择浏览器打开。</p><div class="image-wrap"><img id="previewImage" alt="原始报告页面"></div><p id="imageError" role="alert" hidden>图片暂时打不开，可尝试上方“打开原件”。</p></dialog>
<noscript>请开启浏览器的 JavaScript 后使用资料库。</noscript></body></html>
